app = 'criador-de-form'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  ADDRESS = '0.0.0.0:8080'
  COOKIE_SECURE = 'true'
  FRONTEND_BASE_URL = 'https://criador-de-form.fly.dev'
  FRONTEND_ORIGIN = 'https://criador-de-form.fly.dev'
  FRONTEND_DIST = '/app/frontend/dist'
  GOOGLE_REDIRECT_URL = 'https://criador-de-form.fly.dev/api/auth/google/callback'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/auth/config'
